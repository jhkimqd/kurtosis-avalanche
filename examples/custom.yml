# Run: kurtosis run --enclave custom . --args-file examples/custom.yml
staking: poa
validator_count: 4
metrics: false
node_memory_mb: 1536
node_cpu_millicores: 1000

# Native AvalancheGo option names. Merge order: defaults, global, role, node.
node_config:
  log-level: info
  # network-max-reconnect-delay: 1s
  # snow-sample-size: 3
  # snow-preference-quorum-size: 2
  # snow-confidence-quorum-size: 2
role_config:
  rpc:
    api-admin-enabled: false
node_overrides:
  primary-0:
    log-level: debug

# VM config is separate from AvalancheGo node config.
c_chain_config:
  # eth-apis: [eth, eth-filter, net, web3]
  warp-api-enabled: true
l1_chain_config:
  warp-api-enabled: true
  # log-level: info

# Independent image overrides; leave tools_image empty for the automatic build.
# tools_image: avalanche-tools:local
# primary_image: avaplatform/avalanchego:<compatible-tag>
# node_image: avaplatform/subnet-evm:<compatible-tag>
# aggregator_image: avaplatform/signature-aggregator:<compatible-tag>
# relayer_image: avaplatform/icm-relayer:<compatible-tag>
primary_count: 3
rpc_count: 2
bridge: true
chain_id_start: 77777
l1_genesis:
  config:
    feeConfig:
      minBaseFee: 1000000000
  # alloc:
  #   "your-40-hex-digit-address":
  #     balance: "0xde0b6b3a7640000"
# bootstrap_memory_mb: 512
# bootstrap_cpu_millicores: 500
