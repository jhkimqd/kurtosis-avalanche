# C-Chain chain config (v1.15.0).
#
# This file is a reference, not an arguments file. To set an option, copy
# its line into your arguments file under `primary_network.c_chain_config`
# and remove the `#`. The value on each line is the default; a line without
# a value is not set by default.
#
# AvalancheGo v1.15.0 holds two C-Chain VMs: Coreth for the blocks before the
# Helicon upgrade, and the SAE VM for the blocks after it. Helicon is active
# from the first block of this devnet, so the SAE VM runs the chain. It
# knows only the options below. It ignores an option of the earlier Coreth
# config and names it in a log warning. The one exception is `eth-apis`:
# it is deprecated, and the SAE VM maps it to `apis`.
#
# On the first start, Coreth also reads this file once, before the SAE VM
# takes over. Coreth ignores the options that it does not know.
#
# Generated by scripts/gen-config-reference.py. Do not edit.
primary_network:
  c_chain_config:

    # ── Block Building ──────────────────────────────────────────────────────

    # The target minimum gas price, in wei (aAVAX), that this node will
    # attempt to use when creating blocks.
    # Type: uint64. Default: parent block's target.
    #min-price-target:

    # The target gas per second that this node will attempt to use when
    # creating blocks.
    # Type: uint64. Default: parent block's target.
    #gas-target:

    # The minimum delay between blocks (in milliseconds) that this node will
    # attempt to use when creating blocks.
    # Type: uint64. Default: parent block's target.
    #min-delay-target:

    # ── State and Trie ──────────────────────────────────────────────────────

    # Enable state pruning to save disk space. If disabled, the node runs in
    # archival mode and retains all historical state. When enabled, trie roots
    # are only persisted every commit-interval blocks.
    # Type: bool. Default: true.
    #pruning-enabled: true

    # Number of blocks between writes of the state trie to disk. Omit this
    # option to use the default, which Mainnet and Fuji MUST use. The node
    # does not accept an explicit 0.
    # Type: uint64. Default: 4096.
    #commit-interval: 4096

    # Size of the trie clean cache in MB.
    # Type: uint64. Default: 512.
    #trie-clean-cache: 512

    # Size of the snapshot disk layer clean cache in MB.
    # Type: uint64. Default: 256.
    #snapshot-cache: 256

    # Suppress warnings about an incomplete trie index.
    # Type: bool. Default: false.
    #allow-missing-tries: false

    # EXPERIMENTAL: specifies the database scheme used to store state data;
    # either hash or firewood.
    # Type: string. Default: "hash".
    #state-scheme: "hash"

    # ── Transaction Pool ────────────────────────────────────────────────────

    # Enable treatment of transactions from local accounts as local. Local
    # transactions receive preferential admission and pricing in the mempool.
    # Type: bool. Default: false.
    #local-txs-enabled: false

    # Maximum number of executable transaction slots per account.
    # Type: uint64. Default: 16.
    #tx-pool-account-slots: 16

    # Maximum number of executable transaction slots for all accounts.
    # Type: uint64. Default: 5120.
    #tx-pool-global-slots: 5120

    # ── APIs ────────────────────────────────────────────────────────────────

    # The JSON-RPC APIs this node serves. Methods of an API that is not
    # listed, including APIs added in later releases, are not served, and
    # calling one returns a the method ... does not exist/is not available
    # error. An unrecognised name is a fatal configuration error.
    # On by default: web3, net, txpool, price, chain, tx, subscription,
    # avalanche, trace. Off by default: db, profile.
    # Type: list of strings. Default: every API that is on by default.
    #apis: ["web3", "net", "txpool", "price", "chain", "tx", "subscription", "avalanche", "trace"]

    # Allow unprotected transactions (without EIP-155 replay protection).
    # Type: bool. Default: false.
    #allow-unprotected-txs: false

    # Maximum number of requests that can be batched in an RPC call (0 = no
    # limit).
    # Type: uint64. Default: 1000.
    #batch-request-limit: 1000

    # Maximum duration of an eth_call (or eth_callDetailed) execution. Accepts
    # a Go duration string (e.g. "30s", "2h45m"); valid units are ns, us, ms,
    # s, m and h. Non-positive values result in no limit.
    # Type: duration. Default: 0s.
    #api-max-duration: "0s"

    # Requests for the "pending" block return the last-executed instead of the
    # last-accepted to allow compatibility with EVM-ecosystem tooling that
    # expect the pending block to have post-execution artefacts.
    # Type: bool. Default: true.
    #api-resolve-pending-to-last-executed: true

    # ── State Sync ──────────────────────────────────────────────────────────

    # Enable state sync.
    # Type: bool. Default: true.
    #state-sync-enabled: true

    # ── Warp ────────────────────────────────────────────────────────────────

    # Hex-encoded off-chain Warp messages the node should be willing to sign.
    # These messages do not need to correspond to any on-chain event.
    # Type: list of hex strings. Default: [].
    #warp-off-chain-messages: []
