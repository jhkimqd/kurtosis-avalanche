# Subnet-EVM chain config (v1.15.0): how each node runs the L1 chain.
#
# This file is a reference, not an arguments file. To set an option, copy
# its line into your arguments file under `l1.chain_config` and remove the
# `#`. The value on each line is the Subnet-EVM default; a line without a
# value is not set by default. The config applies to every node of the L1.
# It tunes a node (APIs, caches, pruning, gossip), not the chain rules;
# those are in the genesis (docs/config/l1-genesis.yml).
#
# Generated by helpers/gen-config-reference.py. Do not edit.
l1:
  chain_config:

    # ── Ethereum APIs ───────────────────────────────────────────────────────

    # List of Ethereum services that should be enabled.
    # Type: list of strings. Default: ["eth", "eth-filter", "net", "web3",
    # "internal-eth", "internal-blockchain", "internal-transaction"].
    #eth-apis: ["eth", "eth-filter", "net", "web3", "internal-eth", "internal-blockchain", "internal-transaction"]

    # ── Subnet-EVM Specific APIs ────────────────────────────────────────────

    # Enable the validators API.
    # Type: bool. Default: true.
    #validators-api-enabled: true

    # Enable the admin API for administrative operations.
    # Type: bool. Default: false.
    #admin-api-enabled: false

    # Directory for admin API operations.
    # Type: string. Default: "".
    #admin-api-dir: ""

    # Enable the Warp API for cross-chain messaging.
    # Type: bool. Default: false. Package default: true.
    #warp-api-enabled: true

    # ── API Limits and Security ─────────────────────────────────────────────

    # Maximum gas limit for RPC calls.
    # Type: uint64. Default: 50,000,000.
    #rpc-gas-cap: 50000000

    # Maximum transaction fee cap in AVAX.
    # Type: float64. Default: 100.
    #rpc-tx-fee-cap: 100

    # Maximum duration for API calls (0 = no limit).
    # Type: duration. Default: 0s.
    #api-max-duration: "0s"

    # Maximum number of blocks per getLogs request (0 = no limit).
    # Type: int64. Default: 0.
    #api-max-blocks-per-request: 0

    # Maximum size of HTTP request bodies.
    # Type: uint64. Default: 0.
    #http-body-limit: 0

    # Maximum number of requests that can be batched in an RPC call. For no
    # limit, set either this or batch-response-max-size to 0.
    # Type: uint64. Default: 1,000.
    #batch-request-limit: 1000

    # Maximum size (in bytes) of response that can be returned from a batched
    # RPC call. For no limit, set either this or batch-request-limit to 0.
    # Defaults to 25 MB.
    # Type: uint64. Default: 25,000,000.
    #batch-response-max-size: 25000000

    # ── WebSocket Settings ──────────────────────────────────────────────────

    # Rate at which WebSocket CPU usage quota is refilled (0 = no limit).
    # Type: duration. Default: 0s.
    #ws-cpu-refill-rate: "0s"

    # Maximum stored WebSocket CPU usage quota (0 = no limit).
    # Type: duration. Default: 0s.
    #ws-cpu-max-stored: "0s"

    # ── Trie Caches ─────────────────────────────────────────────────────────

    # Size of the trie clean cache in MB.
    # Type: int. Default: 512.
    #trie-clean-cache: 512

    # Size of the trie dirty cache in MB.
    # Type: int. Default: 512.
    #trie-dirty-cache: 512

    # Memory limit to target in the dirty cache before performing a commit in
    # MB.
    # Type: int. Default: 20.
    #trie-dirty-commit-target: 20

    # Maximum concurrent disk reads trie prefetcher should perform.
    # Type: int. Default: 16.
    #trie-prefetcher-parallelism: 16

    # ── Other Caches ────────────────────────────────────────────────────────

    # Size of the snapshot disk layer clean cache in MB.
    # Type: int. Default: 256.
    #snapshot-cache: 256

    # Depth to keep in the accepted headers and logs cache (blocks).
    # Type: int. Default: 32.
    #accepted-cache-size: 32

    # Trie cache size for state sync server in MB.
    # Type: int. Default: 64.
    #state-sync-server-trie-cache: 64

    # ── Transaction Processing ──────────────────────────────────────────────

    # Enable preimage recording.
    # Type: bool. Default: false.
    #preimages-enabled: false

    # Allow queries for unfinalized blocks.
    # Type: bool. Default: false.
    #allow-unfinalized-queries: false

    # Allow unprotected transactions (without EIP-155).
    # Type: bool. Default: false.
    #allow-unprotected-txs: false

    # List of specific transaction hashes allowed to be unprotected.
    # Type: list of hashes. Default:
    # ["0xfefb2da535e927b85fe68eb81cb2e4a5827c905f78381a01ef2322aa9b0aee8e"].
    #allow-unprotected-tx-hashes: ["0xfefb2da535e927b85fe68eb81cb2e4a5827c905f78381a01ef2322aa9b0aee8e"]

    # Enable treatment of transactions from local accounts as local.
    # Type: bool. Default: false.
    #local-txs-enabled: false

    # ── Snapshots ───────────────────────────────────────────────────────────

    # Wait for snapshot generation on startup.
    # Type: bool. Default: false.
    #snapshot-wait: false

    # Enable snapshot verification.
    # Type: bool. Default: false.
    #snapshot-verification-enabled: false

    # ── Basic Pruning ───────────────────────────────────────────────────────

    # Enable state pruning to save disk space.
    # Type: bool. Default: true.
    #pruning-enabled: true

    # Interval at which to persist EVM and atomic tries (blocks).
    # Type: uint64. Default: 4,096.
    #commit-interval: 4096

    # Maximum blocks to queue before blocking during acceptance.
    # Type: int. Default: 64.
    #accepted-queue-limit: 64

    # ── State Reconstruction ────────────────────────────────────────────────

    # Suppress warnings about incomplete trie index.
    # Type: bool. Default: false.
    #allow-missing-tries: false

    # Starting block for re-populating missing tries (null = disabled).
    # Type: uint64. Default: not set.
    #populate-missing-tries:

    # Concurrent readers for re-populating missing tries.
    # Type: int. Default: 1,024.
    #populate-missing-tries-parallelism: 1024

    # ── Offline Pruning ─────────────────────────────────────────────────────

    # Enable offline pruning.
    # Type: bool. Default: false.
    #offline-pruning-enabled: false

    # Bloom filter size for offline pruning in MB.
    # Type: uint64. Default: 512.
    #offline-pruning-bloom-filter-size: 512

    # Directory for offline pruning data.
    # Type: string. Default: "".
    #offline-pruning-data-directory: ""

    # ── Historical Data ─────────────────────────────────────────────────────

    # Number of blocks before last accepted for proof queries (archive mode
    # only, ~24 hours).
    # Type: uint64. Default: 43,200.
    #historical-proof-query-window: 43200

    # Number of most recent states that are accesible on disk (pruning mode
    # only).
    # Type: uint64. Default: 32.
    #state-history: 32

    # ── Transaction Pool Configuration ──────────────────────────────────────

    # Minimum gas price for transaction acceptance.
    # Type: uint64. Default: 1.
    #tx-pool-price-limit: 1

    # Minimum price bump percentage for transaction replacement.
    # Type: uint64. Default: 10.
    #tx-pool-price-bump: 10

    # Maximum number of executable transaction slots per account.
    # Type: uint64. Default: 16.
    #tx-pool-account-slots: 16

    # Maximum number of executable transaction slots for all accounts.
    # Type: uint64. Default: 5,120.
    #tx-pool-global-slots: 5120

    # Maximum number of non-executable transaction slots per account.
    # Type: uint64. Default: 64.
    #tx-pool-account-queue: 64

    # Maximum number of non-executable transaction slots for all accounts.
    # Type: uint64. Default: 1,024.
    #tx-pool-global-queue: 1024

    # Maximum time transactions can stay in the pool.
    # Type: duration. Default: 10m.
    #tx-pool-lifetime: "10m"

    # ── Push Gossip Settings ────────────────────────────────────────────────

    # Percentage of total stake to push gossip to (range: [0, 1]).
    # Type: float64. Default: 0.9.
    #push-gossip-percent-stake: 0.9

    # Number of validators to push gossip to.
    # Type: int. Default: 100.
    #push-gossip-num-validators: 100

    # Number of non-validator peers to push gossip to.
    # Type: int. Default: 0.
    #push-gossip-num-peers: 0

    # ── Regossip Settings ───────────────────────────────────────────────────

    # Number of validators to regossip to.
    # Type: int. Default: 10.
    #push-regossip-num-validators: 10

    # Number of non-validator peers to regossip to.
    # Type: int. Default: 0.
    #push-regossip-num-peers: 0

    # Addresses to prioritize for regossip.
    # Type: list of addresses. Default: [].
    #priority-regossip-addresses: []

    # ── Timing Configuration ────────────────────────────────────────────────

    # Frequency of push gossip.
    # Type: duration. Default: 100ms.
    #push-gossip-frequency: "100ms"

    # Frequency of pull gossip.
    # Type: duration. Default: 1s.
    #pull-gossip-frequency: "1s"

    # Frequency of regossip.
    # Type: duration. Default: 30s.
    #regossip-frequency: "30s"

    # ── Logging ─────────────────────────────────────────────────────────────

    # Logging level (trace, debug, info, warn, error, crit).
    # Type: string. Default: "info".
    #log-level: "info"

    # Use JSON format for logs.
    # Type: bool. Default: false.
    #log-json-format: false

    # ── Profiling ───────────────────────────────────────────────────────────

    # Directory for continuous profiler output (empty = disabled).
    # Type: string. Default: "".
    #continuous-profiler-dir: ""

    # Frequency to run continuous profiler.
    # Type: duration. Default: 15m.
    #continuous-profiler-frequency: "15m"

    # Maximum number of profiler files to maintain.
    # Type: int. Default: 5.
    #continuous-profiler-max-files: 5

    # ── Metrics ─────────────────────────────────────────────────────────────

    # Enable expensive debug-level metrics.
    # Type: bool. Default: true.
    #metrics-expensive-enabled: true

    # ── Keystore ────────────────────────────────────────────────────────────

    # Directory for keystore files (absolute or relative path).
    # Type: string. Default: "".
    #keystore-directory: ""

    # External signer configuration.
    # Type: string. Default: "".
    #keystore-external-signer: ""

    # Allow insecure account unlocking.
    # Type: bool. Default: false.
    #keystore-insecure-unlock-allowed: false

    # ── Fee Configuration ───────────────────────────────────────────────────

    # Address to send transaction fees to (leave empty if not supported).
    # Type: string. Default: "".
    #feeRecipient: ""

    # ── Network ─────────────────────────────────────────────────────────────

    # Maximum number of outbound active requests for VM2VM network.
    # Type: int64. Default: 16.
    #max-outbound-active-requests: 16

    # ── State Sync ──────────────────────────────────────────────────────────

    # Enable state sync.
    # Type: bool. Default: false.
    #state-sync-enabled: false

    # Force state sync to use highest available summary block.
    # Type: bool. Default: false.
    #state-sync-skip-resume: false

    # List of node IDs to request state from; If not specified (or empty),
    # peers are selected at random.
    # Type: list of node IDs. Default: [].
    #state-sync-ids: []

    # Commit interval for state sync (blocks).
    # Type: uint64. Default: 16,384.
    #state-sync-commit-interval: 16384

    # Minimum blocks ahead required for state sync.
    # Type: uint64. Default: 300,000.
    #state-sync-min-blocks: 300000

    # Number of key/values to request per state sync request.
    # Type: uint16. Default: 1,024.
    #state-sync-request-size: 1024

    # ── Database Configuration ──────────────────────────────────────────────

    # Type of database to use.
    # Type: string. Default: "pebbledb".
    #database-type: "pebbledb"

    # Path to database directory.
    # Type: string. Default: "".
    #database-path: ""

    # Open database in read-only mode.
    # Type: bool. Default: false.
    #database-read-only: false

    # Inline database configuration.
    # Type: string. Default: "".
    #database-config: ""

    # Path to database configuration file.
    # Type: string. Default: "".
    #database-config-file: ""

    # Use standalone database instead of shared one.
    # Type: bool. Default: not set.
    #use-standalone-database:

    # Inspect database on startup.
    # Type: bool. Default: false.
    #inspect-database: false

    # EXPERIMENTAL: specifies the database scheme to store state data; can be
    # one of hash or firewood.
    # Type: string. Default: "hash".
    #state-scheme: "hash"

    # ── Transaction Indexing ────────────────────────────────────────────────

    # Maximum number of blocks from head whose transaction indices are
    # reserved (0 = no limit).
    # Type: uint64. Default: 0.
    #transaction-history: 0

    # Skip indexing transactions entirely.
    # Type: bool. Default: false.
    #skip-tx-indexing: false

    # ── Warp Configuration ──────────────────────────────────────────────────

    # Off-chain messages the node should be willing to sign.
    # Type: list of hex strings. Default: [].
    #warp-off-chain-messages: []

    # Clear warp database on startup.
    # Type: bool. Default: false.
    #prune-warp-db-enabled: false

    # ── Miscellaneous ───────────────────────────────────────────────────────

    # Path to airdrop file.
    # Type: string. Default: "".
    #airdrop: ""

    # Skip checking that upgrades occur before last accepted block Warning:
    # Only use when you understand the implications.
    # Type: bool. Default: false.
    #skip-upgrade-check: false

    # The minimum delay between blocks (in milliseconds) that this node will
    # attempt to use when creating blocks.
    # Type: uint64. Default: not set.
    #min-delay-target:
