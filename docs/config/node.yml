  #simplex-max-rebroadcast-wait: "5s"

  # Beta value to use for consensus.
  # Type: int.
  #snow-commit-threshold: 20

  # Minimum number of concurrent polls for finalizing consensus.
  # Type: int.
  #snow-concurrent-repolls: 4

  # Threshold of nodes required to increase this node's confidence in a
  # network poll. Ignored if snow-quorum-size is provided.
  # Type: int. Package default: 2.
  #snow-confidence-quorum-size: 15

  # Maximum number of processing items to be considered healthy.
  # Type: int.
  #snow-max-processing: 256

  # Maximum amount of time an item should be processing and still be healthy.
  # Type: duration.
  #snow-max-time-processing: "30s"

  # Optimal number of processing containers in consensus.
  # Type: int.
  #snow-optimal-processing: 10

  # Threshold of nodes required to update this node's preference in a network
  # poll. Ignored if snow-quorum-size is provided.
  # Type: int. Package default: 2.
  #snow-preference-quorum-size: 15

  # Threshold of nodes required to update this node's preference and increase
  # its confidence in a network poll.
  # Type: int.
  # Not set by default. When set, it replaces both snow-preference-quorum-size
  # and snow-confidence-quorum-size.
  #snow-quorum-size: 15

  # Number of nodes to query for each network poll.
  # Type: int. Package default: 3.
  #snow-sample-size: 20

  # ── Primary Network staking ───────────────────────────────────────────────
  # Rules for validators and delegators of the Primary Network. They do not
  # apply to L1 validators; the ValidatorManager contract of an L1 sets those.

  # Minimum staking duration post Helicon.
  # Type: duration. Package default: 1s.
  #helicon-min-stake-duration: "1h0m0s"

  # Maximum staking duration.
  # Type: duration. Package default: 87600h.
  # Keep at least 87600h: the genesis validators of this devnet stake for ten
  # years.
  #max-stake-duration: "8760h0m0s"

  # Maximum stake, in nAVAX, that can be placed on a validator on the primary
  # network.
  # Type: uint.
  #max-validator-stake: 3000000000000000

  # Minimum delegation fee, in the range [0, 1000000], that can be charged for
  # delegation on the primary network.
  # Type: uint.
  #min-delegation-fee: 20000

  # Minimum stake, in nAVAX, that can be delegated on the primary network.
  # Type: uint.
  #min-delegator-stake: 25000000000

  # Minimum staking duration.
  # Type: duration. Package default: 2s.
  #min-stake-duration: "24h0m0s"

  # Minimum stake, in nAVAX, required to validate the primary network.
  # Type: uint.
  #min-validator-stake: 2000000000000

  # Maximum consumption rate of the remaining tokens to mint in the staking
  # function.
  # Type: uint.
  #stake-max-consumption-rate: 120000

  # Minimum consumption rate of the remaining tokens to mint in the staking
  # function.
  # Type: uint.
  #stake-min-consumption-rate: 100000

  # Consumption period of the staking function.
  # Type: duration. Package default: 87600h.
  # Must be at least max-stake-duration.
  #stake-minting-period: "8760h0m0s"

  # Supply cap of the staking function.
  # Type: uint.
  #stake-supply-cap: 720000000000000000

  # Frequency of renewing this node's average uptime metric.
  # Type: duration.
  #uptime-metric-freq: "30s"

  # Fraction of time a validator must be online to receive rewards.
  # Type: float.
  #uptime-requirement: 0.8

  # ── Transaction fees ──────────────────────────────────────────────────────
  # Fees of the P-Chain and X-Chain. The validator-fees-* flags set the
  # continuous fee that every L1 validator pays to the P-Chain in AVAX.

  # Transaction fee, in nAVAX, for transactions that create new assets.
  # Type: uint.
  #create-asset-tx-fee: 1000000

  # Complexity multiplier used to convert Bandwidth into Gas.
  # Type: uint.
  #dynamic-fees-bandwidth-weight: 1

  # Complexity multiplier used to convert Compute into Gas.
  # Type: uint.
  #dynamic-fees-compute-weight: 4

  # Complexity multiplier used to convert DB Reads into Gas.
  # Type: uint.
  #dynamic-fees-db-read-weight: 1000

  # Complexity multiplier used to convert DB Writes into Gas.
  # Type: uint.
  #dynamic-fees-db-write-weight: 1000

  # Constant to convert excess Gas to the Gas price.
  # Type: uint.
  #dynamic-fees-excess-conversion-constant: 2164043

  # Maximum amount of Gas the chain is allowed to store for future use.
  # Type: uint.
  #dynamic-fees-max-gas-capacity: 1000000

  # Rate at which Gas is stored for future use.
  # Type: uint.
  #dynamic-fees-max-gas-per-second: 100000

  # Minimum Gas price.
  # Type: uint.
  #dynamic-fees-min-gas-price: 1

  # Target rate of Gas usage.
  # Type: uint.
  #dynamic-fees-target-gas-per-second: 50000

  # Transaction fee, in nAVAX.
  # Type: uint.
  #tx-fee: 1000000

  # Maximum number of validators.
  # Type: uint.
  #validator-fees-capacity: 20000

  # Constant to convert validator excess price.
  # Type: uint.
  #validator-fees-excess-conversion-constant: 865617

  # Minimum validator price in nAVAX per second.
  # Type: uint.
  #validator-fees-min-price: 1

  # Target number of validators.
  # Type: uint.
  #validator-fees-target: 10000

  # ── Health and benchlist ──────────────────────────────────────────────────

  # EWMA failure probability above which a node is benched.
  # Type: float.
  #benchlist-bench-probability: 0.5

  # Max amount of time a peer is benchlisted.
  # Type: duration.
  #benchlist-duration: "5m0s"

  # Halflife of the EWMA averager used for benchlisting.
  # Type: duration.
  #benchlist-halflife: "1m0s"

  # EWMA failure probability below which a node is unbenched.
  # Type: float.
  #benchlist-unbench-probability: 0.2

  # Halflife of averager when calculating a running average in a health check.
  # Type: duration.
  #health-check-averager-halflife: "10s"

  # Time between health checks.
  # Type: duration. Package default: 2s.
  #health-check-frequency: "30s"

  # Node reports unhealthy if the router drops more than this portion of
  # messages.
  # Type: float.
  #router-health-max-drop-rate: 1

  # Node reports unhealthy if there are more than this many outstanding
