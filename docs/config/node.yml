  #router-health-max-outstanding-requests: 1024

  # ── Database ──────────────────────────────────────────────────────────────

  # Path to database config file. Ignored if db-config-file-content is
  # specified.
  # Type: string. Not set by default.
  #db-config-file: ""

  # Specifies base64 encoded database config content.
  # Type: string. Not set by default.
  #db-config-file-content: ""

  # Path to database directory.
  # Type: string.
  #db-dir: "$AVALANCHEGO_DATA_DIR/db"

  # If true, database writes are to memory and never persisted. May still
  # initialize database directory/files on disk if they don't exist.
  # Type: bool.
  #db-read-only: false

  # Database type to use. Must be one of {leveldb, memdb, pebbledb}.
  # Type: string.
  #db-type: "leveldb"

  # ── Resource tracking ─────────────────────────────────────────────────────

  # Enable Meter VMs to track VM performance with more granularity.
  # Type: bool.
  #meter-vms-enabled: true

  # Halflife to use for the cpu tracker. Larger halflife --> cpu usage metrics
  # change more slowly.
  # Type: duration.
  #system-tracker-cpu-halflife: "15s"

  # Halflife to use for the disk tracker. Larger halflife --> disk usage
  # metrics change more slowly.
  # Type: duration.
  #system-tracker-disk-halflife: "1m0s"

  # Minimum percentage (between 0 and 50) of available disk space, under which
  # the node will shutdown.
  # Type: uint. Package default: 0.
  #system-tracker-disk-required-available-space-percentage: 3

  # Warning threshold for the percentage (between 0 and 50) of available disk
  # space, under which the node will be considered unhealthy. Must be >=
  # [system-tracker-disk-required-available-space-percentage].
  # Type: uint. Package default: 0.
  #system-tracker-disk-warning-available-space-percentage: 10

  # Frequency to check the real system usage of tracked processes. More
  # frequent checks --> usage metrics are more accurate, but more expensive to
  # track.
  # Type: duration.
  #system-tracker-frequency: "500ms"

  # Halflife to use for the processing requests tracker. Larger halflife -->
  # usage metrics change more slowly.
  # Type: duration.
  #system-tracker-processing-halflife: "15s"

