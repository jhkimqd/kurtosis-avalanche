name: local integration
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  devnet:
    runs-on: [self-hosted, linux, avalanche-lab]
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        profile: [default, native-pos, erc20-pos, two-l1s]
    env:
      ENCLAVE: avax-ci-${{ github.run_id }}-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - run: make build test
      - run: bash scripts/run.sh examples/${{ matrix.profile }}.yml > artifacts/integration.log 2>&1
      - run: kurtosis enclave inspect "$ENCLAVE" > artifacts/enclave.txt
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.profile }}
          path: artifacts/
      - run: kurtosis enclave rm -f "$ENCLAVE"
        if: always()
