name: functionality tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # examples/ holds the two documented networks. .github/configs/ covers
        # the features that they do not use.
        include:
          - name: poa
            args: examples/poa.yml
            main_file: main.star
          - name: pos
            args: examples/pos.yml
            main_file: main.star
          - name: erc20-pos
            args: .github/configs/erc20-pos.yml
            main_file: main.star
          - name: two-l1s
            args: .github/configs/two-l1s.yml
            main_file: nightly.star
    env:
      ENCLAVE: avax-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p artifacts
      # A devnet fills the disk of a runner: the node images, the tools
      # build, one database per node, and the enclave dump. A runner that
      # starts with little free space ends with "No space left on device".
      # Remove preinstalled toolchains that this job does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/setup-kurtosis
      - run: bash helpers/build.sh
      # Use the system Python that owns the apt-installed PyYAML package.
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Deploy devnet
        id: deploy
        env:
          ARGS_FILE: ${{ matrix.args }}
          MAIN_FILE: ${{ matrix.main_file }}
        # ENCLAVE is unique to the run: the tools refuse to replay the state
        # of one deployment onto another.
        run: kurtosis run --enclave "$ENCLAVE" . --args-file "$ARGS_FILE" --main-file "$MAIN_FILE" 2>&1 | tee artifacts/integration.log
      # Check the network from outside the enclave, with independent tools.
      - run: bash helpers/check-devnet.sh "$ENCLAVE" 2>&1 | tee artifacts/check-devnet.log
      # Check that metrics and logs arrive and that every dashboard has data.
      # The script succeeds at once for a devnet without the stack.
      - run: bash helpers/check-observability.sh "$ENCLAVE" 2>&1 | tee artifacts/check-observability.log
      - name: Collect interchain delivery proof
        if: ${{ always() && matrix.main_file == 'nightly.star' && steps.deploy.outcome == 'success' }}
        run: kurtosis files download "$ENCLAVE" nightly-results artifacts/nightly-results
      - name: Capture service logs before cleanup
        if: always()
        run: |
          # The free space after the deployment, to judge a failure.
          df -h / | tee artifacts/disk.txt
          if kurtosis enclave inspect "$ENCLAVE" > artifacts/enclave.txt 2>&1; then
            kurtosis enclave dump "$ENCLAVE" artifacts/enclave-dump
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ matrix.name }}
          path: artifacts/
          retention-days: 7
      - name: Remove devnet
        if: always()
        run: |
          if kurtosis enclave inspect "$ENCLAVE" >/dev/null 2>&1; then
            kurtosis enclave rm -f "$ENCLAVE"
          fi
