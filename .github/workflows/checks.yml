name: package checks
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-kurtosis
      # Use the system Python that owns the apt-installed PyYAML package.
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      # The runner image ships shellcheck.
      - run: shellcheck -x -P static_files/scripts static_files/scripts/*.sh
      # The tools image holds released tools only; the build checks their sums.
      - run: bash helpers/build.sh
      # Generate identities with the pinned AvalancheGo and check the genesis.
      - run: >-
          docker run --rm -v "$PWD/static_files:/fixtures:ro" avalanche-tools:local bash -c
          'bash /fixtures/scripts/network.sh prepare /tmp/network 4 2
          && jq -e "(.initialStakers | length) == 2 and all(.initialStakers[]; .signer.proofOfPossession | length == 194)" /tmp/network/genesis.json
          && jq -e ".nodes | length == 4" /tmp/network/network.json'
      - run: bash helpers/check-contracts.sh
      # Lint, then plan every file in examples/ and .github/configs/.
      - run: bash helpers/check-package.sh
      # `alloy validate` misses some load errors, so this starts Alloy.
      - run: bash helpers/check-alloy.sh
