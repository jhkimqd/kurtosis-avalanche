name: package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make build test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-evidence
          path: artifacts/
