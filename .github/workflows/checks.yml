name: package checks
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-kurtosis
      # Use the system Python that owns the apt-installed PyYAML package.
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      # The build runs Go unit tests inside the pinned compiler image.
      - run: bash scripts/build.sh
      # Bridge recovery tests use the production ABIs; do not silently skip them.
      - run: docker build --target build --tag avalanche-tools:tests tools
      - run: docker run --rm -v "$PWD/static_files:/fixtures:ro" avalanche-tools:tests sh -c 'test -z "$(gofmt -l ./*.go)" && go test -count=1 -race -v ./... && go vet ./...'
      - run: bash scripts/check-contracts.sh
      # Lint, then plan every file in examples/ and .github/configs/.
      - run: bash scripts/check-package.sh
